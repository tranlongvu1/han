<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="question">Cho cậu xem cái này này <br><span style="font-size: 20px;"></span></h2>

      <img
        class="gif"
        alt="gif"
        src="https://media.giphy.com/media/UTMtgm0mpAu0nSgvox/giphy.gif"
      />
      <div class="btn-group">
       
        <button class="yes-btn">Click</button>
      </div>
    </div>
  
    <script src="script.js"></script>
<script>
  const heartRain = () => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = Math.random() * 2 + 3 + "s";
    heart.innerText = "💖";
    document.body.appendChild(heart);
    setTimeout(() => {
      heart.remove();
    }, 5000);
  };
  setInterval(heartRain, 200);
</script>
  </body>
</html>
